plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.bim.sunlevel'
    compileSdk 34

    defaultConfig {
        applicationId "com.bim.sunlevel"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
